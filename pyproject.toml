[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "1.0.0"
description = "Python execution tracing and time-travel debugging tool"
requires-python = ">=3.9"
dependencies = [
    "typer"
]

[project.scripts]
pychronicle = "pychronicle.cli:app"